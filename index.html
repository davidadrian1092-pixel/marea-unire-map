<!DOCTYPE html>
<html lang="ro">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Harta Interactivă a Marii Uniri</title>
<link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500&family=Plus+Jakarta+Sans:wght@400;500;600&family=Playfair+Display:ital,wght@0,500;0,600;1,400&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css">
<style>
:root{--bg:#0E0D0B;--surf:#161512;--ink:#EAE3D2;--mute:#A29B89;--gold:#C9A961;--butter:#E6D6A3;--line:rgba(201,169,97,.22);
--ser:'Playfair Display',Georgia,serif;--sans:'Plus Jakarta Sans',system-ui,sans-serif;--mono:'JetBrains Mono',ui-monospace,monospace}
*{box-sizing:border-box;margin:0}
body{background:var(--bg);color:var(--ink);font:400 16px/1.7 var(--sans);-webkit-font-smoothing:antialiased}
.mono{font:500 11px var(--mono);letter-spacing:.14em;text-transform:uppercase}
header{text-align:center;padding:64px 18px 28px}
header .mono{color:var(--gold)}
h1{font:500 clamp(2rem,4.6vw,3.3rem)/1.1 var(--ser);margin:16px 0 12px}
header p{color:#cbd5e1;max-width:58ch;margin:0 auto;text-wrap:balance}
nav{display:flex;flex-wrap:wrap;justify-content:center;gap:10px;padding:12px 20px 30px;max-width:1100px;margin:auto}
.pill{font:500 14px var(--sans);color:var(--ink);background:transparent;border:1px solid var(--line);border-radius:999px;padding:10px 18px;cursor:pointer;transition:background .3s,border-color .3s,color .3s}
.pill i{font:normal 500 11px var(--mono);color:var(--gold);margin-right:8px;transition:color .3s}
.pill:hover{border-color:var(--gold);background:rgba(201,169,97,.08)}
.pill.on{background:var(--gold);border-color:var(--gold);color:#0b0f19;font-weight:600}.pill.on i{color:#14120D}
.pill:focus-visible{outline:2px solid var(--butter);outline-offset:2px}
.stage{display:grid;grid-template-columns:1.2fr .8fr;gap:20px;max-width:1360px;margin:auto;padding:0 20px 24px}
@media(max-width:960px){.stage{grid-template-columns:1fr}}
.mapwrap{position:relative;height:72vh;min-height:420px;border:1px solid var(--line);border-radius:6px;overflow:hidden;background:#0a0a09}
.mapwrap:fullscreen{height:100vh;border-radius:0}
#map{position:absolute;inset:0;background:#0a0a09}
#map .leaflet-tile-pane{filter:invert(1) hue-rotate(180deg) brightness(.82) contrast(.92) saturate(.45) sepia(.35)}
.fs{position:absolute;top:12px;right:12px;z-index:1000;font:500 12px var(--sans);padding:7px 14px}
.leaflet-bar a,.leaflet-bar a:hover{background:var(--surf);color:var(--ink);border-bottom:1px solid var(--line)}
.leaflet-bar{border:1px solid var(--line)!important;border-radius:4px;box-shadow:none!important}
.leaflet-control-attribution{background:rgba(14,13,11,.85)!important;color:var(--mute)!important}
.leaflet-control-attribution a{color:var(--gold)!important}
.leaflet-tooltip.tip{background:var(--surf);border:1px solid var(--line);color:var(--ink);box-shadow:none;border-radius:3px;font:500 11px var(--mono);letter-spacing:.1em;text-transform:uppercase}
.leaflet-tooltip-top.tip:before{display:none}
.pin{position:relative;width:26px;height:26px}
.pin b{position:absolute;inset:0;border:1px solid var(--gold);border-radius:50%;background:rgba(14,13,11,.7);transition:transform .3s}
.pin u{position:absolute;inset:8px;border-radius:50%;background:var(--butter)}
.pin:hover b{transform:scale(1.25)}
.pin.on b{border-width:2px;animation:p 2.2s ease-in-out infinite}
@keyframes p{50%{transform:scale(1.18)}}
.panel{height:72vh;min-height:420px;overflow-y:auto;padding:34px;background:var(--surf);border:1px solid var(--line);border-radius:6px;scroll-margin-top:12px}
@media(max-width:960px){.panel{height:auto}}
#content{transition:opacity .3s ease,transform .3s ease}
#content.out{opacity:0;transform:translateY(8px)}
.panel .mono{color:var(--gold)}
h2{font:500 clamp(1.7rem,3vw,2.2rem)/1.15 var(--ser);margin:10px 0 18px}
.panel p{color:#D5CEBD;margin-bottom:14px;font-size:15px;text-align:justify;text-justify:inter-word;hyphens:auto;-webkit-hyphens:auto;text-wrap:pretty}
h2{text-wrap:balance}
figure{margin:22px 0}
.ph{border:none;min-height:0px;display:flex;align-items:center;justify-content:center;text-align:center;padding:14px;color:var(--mute);font:500 11px var(--mono);letter-spacing:.1em;text-transform:uppercase}
figure img{width:100%;display:block;border:none;padding:4px;background:#0b0f17;filter:sepia(25%) contrast(105%);max-height:260px;object-fit:cover}
figcaption{color:var(--mute);font-size:12px;margin-top:8px;text-align:left}
blockquote{border-left:2px solid var(--gold);padding:2px 0 2px 20px;margin:24px 0}
blockquote q{display:block;text-align:left;text-wrap:pretty;font:italic 400 1.3rem/1.45 var(--ser);quotes:"„" "”"}
blockquote cite{display:block;margin-top:10px;font:500 11px var(--mono);letter-spacing:.1em;text-transform:uppercase;color:var(--mute);font-style:normal}
h3{font:500 11px var(--mono);letter-spacing:.14em;text-transform:uppercase;color:var(--mute);border-bottom:1px solid var(--line);padding-bottom:8px;margin:28px 0 4px}
ul{padding:0}
li{list-style:none;display:flex;justify-content:space-between;align-items:baseline;gap:16px;padding:11px 0;border-bottom:1px solid var(--line);font-size:14px}
li span:first-child{font-family:var(--ser);font-size:1.05rem}
li span:first-child{text-align:left}
li span:last-child{color:var(--mute);text-align:right;font-size:13px;flex-shrink:0;max-width:45%}
.note{max-width:1360px;margin:0 auto;padding:0 20px 70px;color:var(--mute);font-size:12px}
#nolib{display:none;padding:40px;text-align:center;color:var(--butter)}
</style>
</head>
<body>
<header>
  <span class="mono">✦ Arhivă digitală · 1918 ✦</span>
  <h1>Harta Interactivă a Marii Uniri</h1>
  <p>De la idee la realitate: drumul Basarabiei, Bucovinei și Transilvaniei spre România.</p>
</header>
<nav id="nav" aria-label="Capitole"></nav>
<div id="nolib">Biblioteca Leaflet nu s-a putut încărca. Verifică conexiunea la internet și reîncarcă pagina.</div>
<main class="stage">
  <div class="mapwrap" id="mapwrap">
    <div id="map"></div>
    <button class="pill fs" id="fs">⛶ Ecran complet</button>
  </div>
  <section class="panel" id="panel" aria-live="polite"><div id="content"></div></section>
</main>

<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
<script>
const CITY = {
  iasi: { c: [47.1585, 27.6014], name: 'Iași', ch: 'context' },
  chisinau: { c: [47.0105, 28.8638], name: 'Chișinău', ch: 'basarabia' },
  cernauti: { c: [48.2921, 25.9358], name: 'Cernăuți', ch: 'bucovina' },
  alba: { c: [46.0683, 23.5716], name: 'Alba Iulia', ch: 'transilvania' }
};
const PROV = {
  basarabia: [[48.5,26.5],[48.4,27.6],[48.0,28.3],[47.3,29.15],[46.85,29.6],[46.5,30.1],[46.2,30.35],[45.7,30.0],[45.4,29.7],[45.45,28.9],[45.47,28.2],[46.5,28.25],[47.2,27.8],[47.9,27.0]],
  bucovina: [[47.45,24.7],[47.9,24.9],[48.3,25.2],[48.5,26.0],[48.35,26.6],[48.15,26.7],[47.7,26.3],[47.5,25.6],[47.35,25.0]],
  transilvania: [[48.0,22.9],[47.95,24.2],[47.5,25.3],[46.9,26.0],[46.2,26.7],[45.5,26.6],[45.4,25.7],[45.35,24.0],[45.2,22.7],[44.8,21.5],[45.3,20.6],[46.2,20.3],[46.9,21.7],[47.6,22.0]]
};
const CH = [
{ id:'intro', n:'01', nav:'Ziua Națională', label:'1\u00A0Decembrie 1918', title:'Ziua Națională a României', pin:'alba', prov:['transilvania'], view:[[46.07,23.57],7],
  text:['La 1\u00A0Decembrie 1918, la Alba Iulia, delegații aleși ai românilor din Transilvania, Banat, Crișana și Maramureș au votat unirea cu România.','Din 1990, 1\u00A0Decembrie este Ziua Națională. Harta urmărește drumul care a dus la această zi: Basarabia, Bucovina, apoi Transilvania.'],
  quote:['…decretează unirea acestor Români și a tuturor teritoriilor locuite de dânșii cu România.','Rezoluția de la Alba Iulia, 1\u00A0decembrie 1918'],
  docs:[['Rezoluția Adunării Naționale de la Alba Iulia','1 dec. 1918'],['Legea nr. 10/1990 (Ziua Națională)','1990']], cap:'Alba Iulia, 1\u00A0Decembrie 1918' },
{ id:'context', n:'02', nav:'Context', label:'1916 – 1918', title:'Contextul: Marele Război și Iașii', pin:'iasi', prov:[], view:[[47.16,27.6],7],
  text:['România a intrat în război în 1916, iar după ocuparea Bucureștiului capitala a fost mutată la Iași. În 1917 armata a rezistat la Mărăști, Mărășești și Oituz.','Imperiile Rus și Austro-Ungar s-au destrămat spre sfârșitul războiului. Principiul autodeterminării a permis provinciilor cu populație românească să hotărască prin adunări reprezentative.'],
  quote:['Pe aici nu se trece!','Atribuit generalului Eremia Grigorescu, Mărășești, 1917'],
  docs:[], cap:'Iași, capitala refugiului' },
{ id:'basarabia', n:'03', nav:'Basarabia', label:'27 martie 1918', title:'Basarabia: Sfatul Țării la Chișinău', pin:'chisinau', prov:['basarabia'], view:[[47.0,28.6],7],
  text:['La 27 martie 1918 (9 aprilie, stil nou), Sfatul Țării a votat unirea cu România, cu 86 de voturi pentru, 3 împotrivă și 36 de abțineri.','Unirea a fost votată cu condiții de autonomie. Sfatul Țării a renunțat la ele în decembrie 1918.'],
  quote:['De azi înainte și pentru totdeauna se unește cu mama sa, România.','Declarația Sfatului Țării, 27 martie 1918'],
  docs:[['Declarația Sfatului Țării','27 mar. 1918'],['Renunțarea la condițiile autonomiei','dec. 1918']],
  pers:[['Ion Inculeț','Președintele Sfatului Țării'],['Pantelimon Halippa','Lider al mișcării naționale'],['Daniel Ciugureanu','Președintele Consiliului Directorilor']], cap:'Sfatul Țării, Chișinău, 1918' },
{ id:'bucovina', n:'04', nav:'Bucovina', label:'28 noiembrie 1918', title:'Bucovina: Congresul General la Cernăuți', pin:'cernauti', prov:['bucovina'], view:[[48.1,25.6],8],
  text:['Bucovina fusese sub stăpânire austriacă din 1775. La 28 noiembrie 1918, Congresul General al Bucovinei, întrunit la Cernăuți și condus de Iancu Flondor, a votat unirea cu România.'],
  quote:['Unirea necondiționată și pe vecie a Bucovinei, în vechile ei hotare, cu Regatul României.','Rezoluția Congresului General, 28 noiembrie 1918'],
  docs:[['Rezoluția Congresului General al Bucovinei','28 nov. 1918']],
  pers:[['Iancu Flondor','Președintele Congresului'],['Ion Nistor','Istoric și om politic']], cap:'Cernăuți, 1918' },
{ id:'transilvania', n:'05', nav:'Transilvania', label:'1\u00A0decembrie 1918', title:'Transilvania: Marea Adunare de la Alba Iulia', pin:'alba', prov:['transilvania'], view:[[46.4,23.6],7],
  text:['La Alba Iulia s-au întrunit 1228 de delegați aleși, în prezența a zeci de mii de oameni. Rezoluția Unirii a fost citită de Vasile Goldiș.','Adunarea a proclamat unirea cu România și a stabilit principii pentru guvernarea provinciei.'],
  quote:['Adunarea Națională a tuturor Românilor din Transilvania, Banat și Țara Ungurească […] decretează unirea acestor Români și a tuturor teritoriilor locuite de dânșii cu România.','Rezoluția de la Alba Iulia, 1\u00A0decembrie 1918'],
  docs:[['Rezoluția de la Alba Iulia','1 dec. 1918'],['Decretul regal de ratificare a Unirii Transilvaniei','11 dec. 1918']],
  pers:[['Vasile Goldiș','A citit Rezoluția Unirii'],['Gheorghe Pop de Băsești','Președintele Adunării'],['Iuliu Hossu','Episcop greco-catolic'],['Iuliu Maniu','Lider al Partidului Național Român']], cap:'Marea Adunare Națională, Alba Iulia' },
{ id:'incoronare', n:'06', nav:'Încoronarea', label:'15 octombrie 1922', title:'Încoronarea de la Alba Iulia', pin:'alba', prov:['basarabia','bucovina','transilvania'], view:[[46.07,23.57],8],
  text:['La 15 octombrie 1922, Regele Ferdinand I și Regina Maria au fost încoronați la Alba Iulia, într-o catedrală construită special pentru ceremonie, ca suverani ai României întregite.'],
  docs:[], cap:'Alba Iulia, 1922' },
{ id:'harta', n:'07', nav:'Harta generală', label:'Cronologie', title:'România Mare: vedere de ansamblu', pin:null, prov:['basarabia','bucovina','transilvania'], fit:true,
  text:['Trei adunări în nouă luni au reunit provinciile cu România. Alege o provincie pe hartă sau un capitol din meniu.'],
  rows:[['27 mar. 1918','Basarabia, Chișinău'],['28 nov. 1918','Bucovina, Cernăuți'],['1 dec. 1918','Transilvania, Alba Iulia'],['15 oct. 1922','Încoronarea, Alba Iulia']], cap:'România Mare, 1918–1922' }
];

const $ = (s) => document.querySelector(s);
const nav = $('#nav'), content = $('#content'), panel = $('#panel');
let map, polys = {}, pins = {}, current = null;

function render(c) {
  const li = (a) => a.map((x) => `<li><span>${x[0]}</span><span>${x[1]}</span></li>`).join('');
  return `<span class="mono">Capitolul ${c.n} · ${c.label}</span>
  <h2>${c.title}</h2>
  ${c.text.map((t) => `<p>${t}</p>`).join('')}
  <figure><div class="ph" data-src="assets/${c.id}.jpg">Imagine de arhivă · assets/${c.id}.jpg</div><figcaption>${c.cap}</figcaption></figure>
  ${c.quote ? `<blockquote><q>${c.quote[0]}</q><cite>${c.quote[1]}</cite></blockquote>` : ''}
  ${c.docs && c.docs.length ? `<h3>Documente</h3><ul>${li(c.docs)}</ul>` : ''}
  ${c.pers ? `<h3>Personalități</h3><ul>${li(c.pers)}</ul>` : ''}
  ${c.rows ? `<h3>Cronologie</h3><ul>${li(c.rows)}</ul>` : ''}`;
}

function loadImg() {
  const ph = content.querySelector('.ph');
  const im = new Image();
  im.onload = () => ph.replaceChildren(im);
  im.alt = ''; im.src = ph.dataset.src;
}

function select(id, fromMap) {
  const c = CH.find((x) => x.id === id);
  if (!c || current === id) return;
  current = id;
  document.querySelectorAll('.pill[data-id]').forEach((b) => b.classList.toggle('on', b.dataset.id === id));
  content.classList.add('out');
  setTimeout(() => {
    content.innerHTML = render(c); loadImg();
    panel.scrollTop = 0;
    content.classList.remove('out');
  }, 300);
  Object.entries(polys).forEach(([k, p]) => {
    const on = c.prov.includes(k);
    p.setStyle({ weight: on ? 2 : 1, fillOpacity: on ? .22 : .05, opacity: on ? 1 : .5 });
  });
  Object.entries(pins).forEach(([k, m]) => m.getElement()?.querySelector('.pin').classList.toggle('on', k === c.pin));
  if (c.fit) map.flyToBounds(L.featureGroup(Object.values(polys)).getBounds().pad(.1), { duration: 1.4 });
  else map.flyTo(c.view[0], c.view[1], { duration: 1.4 });
  if (fromMap && innerWidth < 960) panel.scrollIntoView({ behavior: 'smooth' });
}

function init() {
  if (!window.L) { $('#nolib').style.display = 'block'; return; }
  CH.forEach((c) => {
    const b = document.createElement('button');
    b.className = 'pill'; b.dataset.id = c.id;
    b.innerHTML = `<i>${c.n}</i>${c.nav}`;
    b.onclick = () => select(c.id);
    nav.appendChild(b);
  });
  map = L.map('map', { zoomControl: true, minZoom: 5, maxZoom: 12, scrollWheelZoom: false }).setView([46.4, 25.3], 6);
  L.tileLayer('https://tile.openstreetmap.org/{z}/{x}/{y}.png', {
    attribution: '&copy; <a href="https://www.openstreetmap.org/copyright">OpenStreetMap</a>', maxZoom: 19 }).addTo(map);
  map.on('click', () => map.scrollWheelZoom.enable());
  map.on('mouseout', () => map.scrollWheelZoom.disable());
  Object.entries(PROV).forEach(([k, pts]) => {
    polys[k] = L.polygon(pts, { color: '#C9A961', weight: 1, opacity: .5, fillColor: '#C9A961', fillOpacity: .05 })
      .addTo(map).on('click', () => select(k, true));
  });
  Object.entries(CITY).forEach(([k, v]) => {
    pins[k] = L.marker(v.c, { icon: L.divIcon({ className: '', html: '<div class="pin"><b></b><u></u></div>', iconSize: [26, 26], iconAnchor: [13, 13] }), title: v.name })
      .bindTooltip(v.name, { direction: 'top', offset: [0, -14], className: 'tip' })
      .addTo(map).on('click', () => select(v.ch, true));
  });
  const wrap = $('#mapwrap');
  $('#fs').onclick = () => document.fullscreenElement ? document.exitFullscreen() : wrap.requestFullscreen?.();
  document.addEventListener('fullscreenchange', () => setTimeout(() => map.invalidateSize(), 200));
  content.innerHTML = render(CH[0]); loadImg();
  current = null; select('intro');
}
init();
</script>
</body>
</html>
